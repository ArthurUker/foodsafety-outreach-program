<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>章节实时预览（编辑模式）</title>

  <!-- 与前台完全相同的样式表顺序：保证画布所见即所得 -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/canvas.css" />

  <style>
    /* 画布内不跑滚动进场动画：强制动画终态，否则编辑时内容是不可见的 */
    .reveal { opacity: 1 !important; transform: none !important; }
    body { padding: 0; min-height: 0; }
  </style>
</head>
<body>
  <!-- 玻璃折射滤镜：与 index.html 内联同一份，缺失会让 backdrop-filter 整体失效 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="preview-root" id="previewRoot"></div>

  <script type="module" src="js/admin/preview-agent.js"></script>
</body>
</html>
