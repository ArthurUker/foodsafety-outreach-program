# =========================================================
# 生产部署示例 —— 腾讯云 CVM + 独立数据盘 + 子域名 HTTPS
#
# 使用方式：
#   1. cp deploy/deploy.tencent-cvm.example.conf deploy/deploy.prod.conf
#      （deploy.prod.conf 已被 .gitignore 忽略——真实值只存在于服务器本地）
#   2. 在 deploy/deploy.prod.conf 中填入真实值（下方所有 <占位符> 与空值项）
#   3. sudo bash deploy/deploy.sh deploy/deploy.prod.conf
#
# 脚本为环境自适应：Node/PostgreSQL/Caddy 已装则复用、缺则安装；
# 端口或 80/443 被其它服务占用时会 fail-fast 并给出排查指引。
#
# 本文件只允许包含占位符与非敏感默认值，禁止填写任何真实凭据。
# =========================================================

# ===== 系统标识（目录 / 系统用户 / systemd 服务名）=====
SYSTEM_NAME="foodsafety-outreach"
APP_NAME="${SYSTEM_NAME}-api"

# ===== 代码来源 =====
# 部署主机需具备访问本仓库的凭据（SSH key 或 HTTPS token）
REPO_URL="git@github.com:ArthurUker/foodsafety-outreach-program.git"
DEPLOY_BRANCH="main"

# ===== 目录布局 / 数据盘 =====
# 系统盘空间紧张时：填数据盘挂载点（以 lsblk/df -h 实测为准，如 /data），整套系统全部落数据盘：
#   代码 + dist      → <DATA_ROOT>/<SYSTEM_NAME>
#   日志             → <DATA_ROOT>/logs/<SYSTEM_NAME>
#   本站 PG 数据     → <DATA_ROOT>/pg/<SYSTEM_NAME>（独立表空间）
# 脚本会校验挂载点真实存在（未挂载即中止），避免数据静默写回系统盘。
DATA_ROOT=""                  # <- 填数据盘挂载点；留空 = 使用系统盘（/opt + /var/log）
if [[ -n "$DATA_ROOT" ]]; then
  REPO_ROOT="${DATA_ROOT}/${SYSTEM_NAME}"
  LOG_DIR="${DATA_ROOT}/logs/${SYSTEM_NAME}"
else
  REPO_ROOT="/opt/${SYSTEM_NAME}"
  LOG_DIR="/var/log/${SYSTEM_NAME}"
fi

# ===== 端口 =====
API_PORT=3100                 # 后端内部端口，仅监听 127.0.0.1，安全组无需放行
FRONTEND_PORT=8081            # 仅 DOMAIN 为空时的兜底端口；域名模式下不使用

# ===== 公网暴露（Caddy 自动申请 HTTPS 证书）=====
DOMAIN="<YOUR_DOMAIN>"        # <- 改成你的子域名！裸域名，不带 https://；需先加 DNS A 记录指向服务器公网 IP
TLS_EMAIL=""                  # 可选：Let's Encrypt 到期通知邮箱

# ===== 数据库（独立数据库 + 独立角色，复用服务器已有 PostgreSQL 实例）=====
PG_HOST="127.0.0.1"
PG_PORT="5432"
PG_DB_NAME="<DATABASE_NAME>"  # <- 改成实际数据库名
PG_USER="<DATABASE_USER>"     # <- 改成实际数据库角色名
PG_PASSWORD=""                # 留空 = 脚本自动生成强随机密码（写入 backend/.env，绝不回显到仓库）

# ===== 跨域来源（留空 = 按 DOMAIN 自动生成 https://<DOMAIN>）=====
CORS_ORIGIN=""

# ===== 初始管理员 =====
SEED_ADMIN_USERNAME="admin"   # <- 可改为其它用户名；密码由脚本自动生成（部署结束时仅输出一次）
SEED_ADMIN_PASSWORD=""        # 留空 = 脚本自动生成强随机密码
SEED_ADMIN_DISPLAY_NAME="平台管理员"

# ===== 运行时安装 =====
INSTALL_RUNTIME=true          # Node/PostgreSQL/Caddy 已装则自动跳过
NODE_VERSION="20"

# ===== 数据库初始化 =====
# 首次部署自动执行 seed（建管理员 + 导入章节内容）
SEED_ON_FIRST_DEPLOY=true

# ===== 钉钉群机器人通知（可选）=====
# 新留言实时推送到钉钉运营群；不配置则通知链路关闭，不影响留言落库
# DINGTALK_WEBHOOK=https://oapi.dingtalk.com/robot/send?access_token=xxxx
# 机器人安全方式二选一：「自定义关键词」填「留言」即可（代码已内置该词）；「加签」则填写下方密钥
# DINGTALK_SECRET=
