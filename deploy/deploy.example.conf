# =========================================================
# 部署适配文件（复制为 deploy.conf 后按实际服务器参数修改）
# 用法：sudo bash deploy/deploy.sh deploy/deploy.conf
# =========================================================

# ===== 系统标识 =====
SYSTEM_NAME="foodsafety-outreach"
APP_NAME="${SYSTEM_NAME}-api"

# ===== 代码来源 =====
REPO_URL="https://github.com/ArthurUker/foodsafety-outreach-program.git"
DEPLOY_BRANCH="main"

# ===== 目录布局 =====
REPO_ROOT="/opt/${SYSTEM_NAME}"
LOG_DIR="/var/log/${SYSTEM_NAME}"

# ===== 端口（每台服务器内须唯一）=====
API_PORT=3000                 # 后端内部端口，仅监听 127.0.0.1
FRONTEND_PORT=8080            # 对外访问端口（安全组须放行）

# ===== 公网暴露（Caddy）=====
DOMAIN=""                     # 有域名时填写，Caddy 自动申请 HTTPS
TLS_EMAIL=""

# ===== 数据库（PostgreSQL）=====
PG_HOST="127.0.0.1"
PG_PORT="5432"
PG_DB_NAME="foodsafety_outreach"
PG_USER="foodsafety"
PG_PASSWORD=""                # 留空 = 脚本自动生成强随机密码

# ===== 跨域来源 =====
# 留空：脚本尝试用 curl ifconfig.me 获取公网 IP 生成 http://<IP>:<FRONTEND_PORT>
CORS_ORIGIN=""

# ===== 初始管理员 =====
SEED_ADMIN_USERNAME="admin"
SEED_ADMIN_PASSWORD=""        # 留空 = 脚本自动生成（部署结束时输出）
SEED_ADMIN_DISPLAY_NAME="平台管理员"

# ===== 运行时安装 =====
INSTALL_RUNTIME=true
NODE_VERSION="20"

# ===== 数据库初始化 =====
# 首次部署自动执行 seed（建管理员 + 导入章节内容）
SEED_ON_FIRST_DEPLOY=true
