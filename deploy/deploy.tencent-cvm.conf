# =========================================================
# 腾讯云 CVM（111.231.166.161）—— 推广站独立部署适配
# 用法：sudo bash deploy/deploy.sh deploy/deploy.tencent-cvm.conf
#
# 服务器现状自适应：Node/PostgreSQL/Caddy 缺啥装啥，已装则复用；
# 端口或 80/443 被其它服务占用时脚本会 fail-fast 并给出排查指引。
#
# CORS_ORIGIN 留空即可，脚本会按 DOMAIN 自动生成 https://<DOMAIN>。
# =========================================================

# ===== 系统标识（目录/系统用户/systemd 服务名）=====
SYSTEM_NAME="foodsafety-outreach"
APP_NAME="${SYSTEM_NAME}-api"

# ===== 代码来源 =====
# 2026-09-03 实测：GitHub HTTPS(443) 可达（HTTP 200），且 SSH 已认证为 ArthurUker。
# 保留 SSH 拉代码（免密钥口令、不受 SNI 策略影响）。
REPO_URL="git@github.com:ArthurUker/foodsafety-outreach-program.git"
DEPLOY_BRANCH="main"

# ===== 目录布局 / 数据盘 =====
# 系统盘空间紧张时：填数据盘挂载点（以 lsblk/df -h 实测为准，如 /data），整套系统全部落数据盘：
#   代码 + dist      → <DATA_ROOT>/foodsafety-outreach
#   日志             → <DATA_ROOT>/logs/foodsafety-outreach
#   本站 PG 数据     → <DATA_ROOT>/pg/foodsafety-outreach（独立表空间，主集群与 foodsentinel 库不受影响）
# 脚本会校验挂载点真实存在（未挂载即中止），避免数据静默写回系统盘。
DATA_ROOT="/mnt/datadisk0"         # 数据盘 /dev/vdb（50G ext4，fstab defaults,nofail 持久挂载，余 46G）
if [[ -n "$DATA_ROOT" ]]; then
  REPO_ROOT="${DATA_ROOT}/${SYSTEM_NAME}"
  LOG_DIR="${DATA_ROOT}/logs/${SYSTEM_NAME}"
else
  REPO_ROOT="/opt/${SYSTEM_NAME}"
  LOG_DIR="/var/log/${SYSTEM_NAME}"
fi

# ===== 端口（2026-09-03 实测 3000/3100/8080 均空闲；80/443 由 Caddy 监听，域名模式直接复用）=====
API_PORT=3100                 # 后端内部端口，仅监听 127.0.0.1，安全组无需放行
FRONTEND_PORT=8081            # 仅 DOMAIN 为空时的兜底端口；域名模式下不使用

# ===== 公网暴露（Caddy 自动申请 HTTPS 证书）=====
# 现有站点均为 *.digifluidic.com 子域（foodsentinel / grafana / prometheus），沿用同级命名。
# ⚠️ 部署前需在 DNS 增加该子域名 A 记录 → 111.231.166.161
DOMAIN="foodsafety.digifluidic.com"
TLS_EMAIL="renkang.guo@digifluidic.com"   # 与现有站点保持一致，Let's Encrypt 到期提醒

# ===== 数据库（复用服务器已有 PostgreSQL 14 实例，独立建库 + 独立表空间落数据盘，不影响 foodsentinel）=====
PG_HOST="127.0.0.1"
PG_PORT="5432"
PG_DB_NAME="foodsafety_outreach"
PG_USER="foodsafety"
PG_PASSWORD=""                # 留空 = 脚本自动生成强随机密码（写入 backend/.env）

# ===== 跨域来源（留空 = 按 DOMAIN 自动生成 https://<DOMAIN>）=====
CORS_ORIGIN=""

# ===== 初始管理员 =====
SEED_ADMIN_USERNAME="admin"
SEED_ADMIN_PASSWORD=""        # 留空 = 脚本自动生成（部署结束时输出一次）
SEED_ADMIN_DISPLAY_NAME="平台管理员"

# ===== 运行时安装（服务器已有 Node 20 / Caddy / PostgreSQL，已装部分自动跳过）=====
INSTALL_RUNTIME=true
NODE_VERSION="20"

# ===== 数据库初始化 =====
# 首次部署自动执行 seed（建管理员 + 导入章节内容）
SEED_ON_FIRST_DEPLOY=true
