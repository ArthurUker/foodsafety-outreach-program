<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园食安卫士 | 校园食品安全「检·教·治」一体化推广方案</title>
  <meta name="description" content="以校园食品安全检测中心为载体，覆盖标准化检测、宣教培训与闭环治理的校园食安推广方案，已在真实校园场景完成验证。" />
  <meta name="keywords" content="校园食品安全,食安检测中心,微流控快检,宣教培训,闭环治理,食安推广方案" />
  <meta name="theme-color" content="#0071e3" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <!-- glass.css 必须在 base.css 之后：它需要把 body 背景改为透明，让极光壁纸透出 -->
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />
</head>
<body>
  <!-- 玻璃折射滤镜（零侵入，供 .glass 的 backdrop-filter 引用）
       缺失该滤镜会导致整条 backdrop-filter 声明失效，故每个页面都需内联。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <a class="skip-link" href="#overview">跳到主要内容</a>

  <header class="site-header" id="top">
    <div class="container header-inner">
      <a href="#hero" class="brand js-scroll">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="28" height="28" role="img" aria-label="校">
            <path d="M32 8l20 8v18c0 13-9 21-20 23-11-2-20-10-20-23V16z" fill="currentColor" opacity="0.16"/>
            <path d="M32 8l20 8v18c0 13-9 21-20 23-11-2-20-10-20-23V16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <path d="M23 32l6 6 12-14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong data-site-name>校园食安卫士</strong>
          <small data-site-slogan>校园食品安全「检·教·治」一体化推广方案</small>
        </span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="打开导航菜单" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="navMenu" data-nav aria-label="主导航">
        <!-- 导航项由 js/main.js 依据 js/modules/registry.js 生成 -->
      </nav>
    </div>
  </header>

  <main id="app">
    <div class="app-loader" id="appLoader" role="status" aria-live="polite">
      <span class="loader-ring" aria-hidden="true"></span>
      <p>正在加载方案内容…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <h3 data-site-name>校园食安卫士</h3>
        <p data-site-slogan>校园食品安全「检·教·治」一体化推广方案</p>
      </div>
      <div class="footer-meta">
        <p data-footer-copyright>© 2026 校园食安卫士</p>
        <p data-footer-note>本方案用于学术交流、方案汇报与项目展示。</p>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M12 5l7 7-1.4 1.4L12 8.8 6.4 13.4 5 12z" fill="currentColor"/>
    </svg>
  </button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
